name: Universal TG News Parser
on:
  schedule:
    - cron: '*/15 * * * *' # Проверка каждые 15 минут
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and format last TG post
        run: |
          # === НАСТРОЙКА КАНАЛА ===
          TARGET_CHANNEL="zhest_tresh_videoj"
          
          # Скачиваем веб-версию ленты выбранного канала
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://t.me" > tg.html
          
          # Универсальный сборщик текста на Python (ищет тексты и медиа-подписи)
          python3 -c "
          import re
          import html
          
          try:
              with open('tg.html', 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Регулярка ищет как обычный текст, так и подписи к фото/видео (tgme_widget_message_text)
              posts = re.findall(r'class=\"tgme_widget_message_text[^>]*\">(.*?)</div>', content, re.DOTALL)
              
              if posts:
                  # Берем самый последний свежий пост (даже если это подпись к фото)
                  last_post = posts[-1]
                  
                  # Переводим веб-брейки <br/> в понятные Майнкрафту переносы строк \n
                  clean_text = re.sub(r'<br\s*/?>', '\n', last_post)
                  # Счищаем все ссылки, жирный шрифт и прочие HTML-теги
                  clean_text = re.sub(r'<[^>]+>', '', clean_text)
                  # Убираем лишние пробелы и декодируем спецсимволы
                  final_text = html.unescape(clean_text).strip()
                  
                  if final_text:
                      with open('news.txt', 'w', encoding='utf-8') as out:
                          out.write(final_text)
                      print('Success: Media-caption or Text from ' + '$TARGET_CHANNEL' + ' saved!')
                  else:
                      with open('news.txt', 'w', encoding='utf-8') as out:
                          out.write('Пост содержит только медиафайл без описания.')
              else:
                  with open('news.txt', 'w', encoding='utf-8') as out:
                      out.write('Ошибка: Сообщения на канале не обнаружены.')
          except Exception as e:
              with open('news.txt', 'w', encoding='utf-8') as out:
                  out.write('Ошибка парсинга: ' + str(e))
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name "TG-Parser-Bot"
          git config --global user.email "bot@github.com"
          git add news.txt
          git diff-index --quiet HEAD || git commit -m "Автообновление медиа-новости из ТГ"
          git push
