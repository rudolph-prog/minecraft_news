name: Universal TG News Parser
on:
  schedule:
    - cron: '*/15 * * * *' # Авто-проверка каждые 15 минут
  workflow_dispatch: # Кнопка ручного пинка

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and format last TG post
        run: |
          # === НАСТРОЙКА КАНАЛА ===
          TARGET_CHANNEL="zhest_tresh_videoj"
          
          # Скачиваем через специальный RSS-обходчик, который телеграм никогда не блокирует
          curl -s -L "https://i-c-a.su" > tg_feed.xml
          
          # Железобетонный парсер текста на Python
          python3 -c "
          import re
          import html
          
          try:
              with open('tg_feed.xml', 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Вытаскиваем текст поста из блока описания RSS
              post_match = re.search(r'<description><!\[CDATA\[(.*?)(?:\]\]>|</description>)', content, re.DOTALL)
              
              if post_match:
                  raw_post = post_match.group(1)
                  
                  # Превращаем веб-переносы <br> в обычные \n для Майнкрафта
                  clean_text = re.sub(r'<br\s*/?>', '\n', raw_post)
                  # Вырезаем абсолютно все остальные ссылки и теги
                  clean_text = re.sub(r'<[^>]+>', '', clean_text)
                  # Декодируем спецсимволы текста
                  final_text = html.unescape(clean_text).strip()
                  
                  if final_text:
                      with open('news.txt', 'w', encoding='utf-8') as out:
                          out.write(final_text)
                      print('Успешно! Текст новости сохранен.')
                  else:
                      with open('news.txt', 'w', encoding='utf-8') as out:
                          out.write('Последний пост содержит только картинку без подписи.')
              else:
                  # Резервный поиск по стандартным тегам, если шлюз выдал альтернативный формат
                  alt_match = re.search(r'<description>(.*?)</description>', content, re.DOTALL)
                  if alt_match:
                      clean_text = re.sub(r'<[^>]+>', '', alt_match.group(1))
                      final_text = html.unescape(clean_text).strip()
                      with open('news.txt', 'w', encoding='utf-8') as out:
                          out.write(final_text)
                  else:
                      with open('news.txt', 'w', encoding='utf-8') as out:
                          out.write('Новости временно обновляются, подождите...')
          except Exception as e:
              with open('news.txt', 'w', encoding='utf-8') as out:
                  out.write('Ошибка чтения ленты: ' + str(e))
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name "TG-Parser-Bot"
          git config --global user.email "bot@github.com"
          git add news.txt
          git diff-index --quiet HEAD || git commit -m "Автообновление через RSS-ленту"
          git push
