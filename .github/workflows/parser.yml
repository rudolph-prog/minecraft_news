name: Universal TG News Parser
on:
  schedule:
    - cron: '*/15 * * * *' # Проверка каждые 15 минут
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and format last TG post
        run: |
          # === НАСТРОЙКА КАНАЛА ===
          TARGET_CHANNEL="zhest_tresh_videoj"
          
          # Скачиваем веб-версию ленты выбранного канала
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64); (KHTML, like Gecko)" "https://t.me" > tg.html
          
          # Бронебойный сборщик текста на Python
          python3 -c "
          import re
          import html
          
          try:
              with open('tg.html', 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Ищем абсолютно все открывающие теги текстовых блоков в ТГ
              matches = list(re.finditer(r'class=\"[^\"]*tgme_widget_message_text[^\"]*\">', content))
              
              if matches:
                  # Берем самый последний (свежий) пост
                  last_match = matches[-1]
                  start_pos = last_match.end()
                  
                  # Ищем закрывающий тег именно для этого блока
                  end_pos = content.find('</div>', start_pos)
                  
                  if end_pos != -1:
                      raw_post = content[start_pos:end_pos]
                      
                      # Переводим HTML-переносы строк <br/> в обычные \n
                      clean_text = re.sub(r'<br\s*/?>', '\n', raw_post)
                      # Счищаем вообще все остальные HTML-теги и скрытый мусор
                      clean_text = re.sub(r'<[^>]+>', '', clean_text)
                      # Декодируем веб-символы
                      final_text = html.unescape(clean_text).strip()
                      
                      if final_text:
                          with open('news.txt', 'w', encoding='utf-8') as out:
                              out.write(final_text)
                          print('Success! Post text saved.')
                      else:
                          with open('news.txt', 'w', encoding='utf-8') as out:
                              out.write('Пост содержит только медиафайл без текста.')
                  else:
                      with open('news.txt', 'w', encoding='utf-8') as out:
                          out.write('Ошибка разметки: закрывающий тег не найден.')
              else:
                  with open('news.txt', 'w', encoding='utf-8') as out:
                      out.write('Посты на канале временно не обнаружены. Повтор...')
          except Exception as e:
              with open('news.txt', 'w', encoding='utf-8') as out:
                  out.write('Ошибка парсинга: ' + str(e))
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name "TG-Parser-Bot"
          git config --global user.email "bot@github.com"
          git add news.txt
          git diff-index --quiet HEAD || git commit -m "Исправление парсера текста"
          git push
